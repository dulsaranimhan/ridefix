openapi: 3.1.0
info:
  title: RideFix Request Service API
  version: 0.1.0
  description: >-
    MVP request lifecycle API. Authentication is not implemented; driverId and providerId are
    currently accepted as request data and are not authenticated identities. Do not expose this API
    to untrusted clients until token verification and ownership checks are integrated.
servers:
  - url: http://localhost:4001
paths:
  /requests:
    post:
      summary: Create a request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      summary: List requests for a driver
      parameters:
        - name: driverId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Requests ordered newest first
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
  /requests/open:
    get:
      summary: List requests waiting for a provider
      responses:
        '200':
          description: Open requests ordered oldest first
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/Request' }
        '500': { $ref: '#/components/responses/ServerError' }
  /requests/assigned:
    get:
      summary: List active jobs assigned to a provider
      parameters:
        - name: providerId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active and completed jobs for this provider
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
  /requests/{id}:
    get:
      summary: Get a request by ID
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request found
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /requests/{id}/cancel:
    post:
      summary: Cancel an eligible request
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /requests/{id}/accept:
    post:
      description: >-
        Used by the Bidding Service when a driver accepts a bid. Provider apps should submit a bid
        with POST /bids instead of calling this directly.
      summary: Assign an open request to the accepting provider
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId]
              properties:
                providerId: { type: string, format: uuid }
      responses:
        '200':
          description: Request accepted and assigned
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /requests/{id}/status:
    patch:
      summary: Update an assigned job through its work states
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, status]
              properties:
                providerId: { type: string, format: uuid }
                status:
                  type: string
                  enum: [On the way, In progress, Completed]
      responses:
        '200':
          description: Job status updated
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { $ref: '#/components/schemas/Request' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CreateRequest:
      type: object
      required: [driverId, serviceType, problemDescription, locationLatitude, locationLongitude]
      properties:
        driverId: { type: string, format: uuid }
        vehicleId: { type: [string, 'null'], format: uuid }
        vehicleDescription: { type: [string, 'null'], maxLength: 200 }
        serviceType:
          type: string
          enum: [Roadside Assistance, Book a Garage, Towing Service, Battery Service]
        problemDescription: { type: string, minLength: 1, maxLength: 5000 }
        locationLatitude: { type: number, minimum: -90, maximum: 90 }
        locationLongitude: { type: number, minimum: -180, maximum: 180 }
        locationAddress: { type: [string, 'null'], maxLength: 500 }
    Request:
      allOf:
        - $ref: '#/components/schemas/CreateRequest'
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            providerId: { type: [string, 'null'], format: uuid }
            status:
              type: string
              enum:
                [
                  Created,
                  Matching,
                  Open for bids,
                  Awaiting payment,
                  Booked,
                  On the way,
                  In progress,
                  Completed,
                  Cancelled,
                  Expired,
                  Disputed,
                ]
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Invalid input (for example invalid UUID, unsupported service type, or invalid coordinates)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Request does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request is not in a cancellable state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Unexpected database or service failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
