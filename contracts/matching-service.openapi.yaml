openapi: 3.1.0
info:
  title: RideFix Matching Service API
  version: 0.1.0
  description: >-
    Route lookup backed by OSRM, and provider availability. Provider discovery and matching are not
    implemented. Provider IDs are not authenticated identities yet.
servers:
  - url: http://localhost:4002
paths:
  /matching/providers/{providerId}/availability:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a provider's availability
      description: A provider who has never set this is reported as offline.
      responses:
        '200':
          $ref: '#/components/responses/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/AvailabilityError'
    put:
      summary: Set a provider's availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isAvailable]
              properties:
                isAvailable: { type: boolean }
      responses:
        '200':
          $ref: '#/components/responses/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/AvailabilityError'
  /matching/route:
    get:
      operationId: getDrivingRoute
      summary: Get an OSRM driving route between two coordinates
      parameters:
        - name: fromLng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: fromLat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: toLng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: toLat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
      responses:
        '200':
          description: Route found
          content:
            application/json:
              schema:
                type: object
                required: [provider, distanceMeters, durationSeconds, geometry]
                properties:
                  provider: { type: string, const: osrm }
                  distanceMeters: { type: number, minimum: 0 }
                  durationSeconds: { type: number, minimum: 0 }
                  geometry:
                    type: object
                    required: [type, coordinates]
                    properties:
                      type: { type: string, const: LineString }
                      coordinates:
                        type: array
                        items:
                          type: array
                          prefixItems: [{ type: number }, { type: number }]
                          minItems: 2
                          maxItems: 2
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
components:
  responses:
    AvailabilityResponse:
      description: The provider's availability
      content:
        application/json:
          schema:
            type: object
            required: [availability]
            properties:
              availability:
                type: object
                required: [providerId, isAvailable, updatedAt]
                properties:
                  providerId: { type: string, format: uuid }
                  isAvailable: { type: boolean }
                  updatedAt: { type: [string, 'null'], format: date-time }
    AvailabilityError:
      description: Invalid provider ID or value
    Error:
      description: Request or upstream routing error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
