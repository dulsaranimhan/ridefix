
# Local development stack for RideFix.
#
# Start: docker compose up --build
# Optional Redis and RabbitMQ:
#   docker compose --profile optional up --build
#
# Shared PostgreSQL database: ridefix_db

x-service: &service
  build:
    context: .
    dockerfile: infra/docker/service.Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &service-env
    NODE_ENV: ${NODE_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    REQUEST_SERVICE_URL: http://request-service:4001
    MATCHING_SERVICE_URL: http://matching-service:4002
    BIDDING_SERVICE_URL: http://bidding-service:4003
    TRACKING_SERVICE_URL: http://tracking-service:4004
    PAYMENT_SERVICE_URL: http://payment-service:4005
    NOTIFICATION_SERVICE_URL: http://notification-service:4006
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://localhost:$$PORT/health || exit 1']
    interval: 10s
    timeout: 3s
    retries: 5

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridefix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ridefix_db}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  kong:
    image: kong:3.9
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./infra/kong:/kong:ro
    ports:
      - '${KONG_PROXY_PORT:-8000}:8000'
      - '127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001'
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 10

  request-service:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: request-service
    environment:
      <<: *service-env
      PORT: 4001
      REQUEST_SERVICE_PORT: 4001
      REQUEST_DB_URL: postgres://${POSTGRES_USER:-ridefix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ridefix_db}

  matching-service:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: matching-service
    environment:
      <<: *service-env
      PORT: 4002
      MATCHING_SERVICE_PORT: 4002
      MATCHING_DB_URL: postgres://${POSTGRES_USER:-ridefix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ridefix_db}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}

  bidding-service:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: bidding-service
    environment:
      <<: *service-env
      PORT: 4003
      BIDDING_SERVICE_PORT: 4003
      BIDDING_DB_URL: postgres://${POSTGRES_USER:-ridefix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ridefix_db}

  tracking-service:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: tracking-service
    environment:
      <<: *service-env
      PORT: 4004
      TRACKING_SERVICE_PORT: 4004
      TRACKING_DB_URL: postgres://${POSTGRES_USER:-ridefix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ridefix_db}

  payment-service:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: payment-service
    environment:
      <<: *service-env
      PORT: 4005
      PAYMENT_SERVICE_PORT: 4005
      PAYMENT_DB_URL: postgres://${POSTGRES_USER:-ridefix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ridefix_db}
      EPAY_ACTION_URL: ${EPAY_ACTION_URL:-https://sandbox-ipg.epay.lk/}
      EPAY_MERCHANT_ID: ${EPAY_MERCHANT_ID:-}
      EPAY_APP_SECRET: ${EPAY_APP_SECRET:-}
      PAYMENT_INTERNAL_API_KEY: ${PAYMENT_INTERNAL_API_KEY:-}
      EPAY_NOTIFY_URL: ${EPAY_NOTIFY_URL:-}
      EPAY_RETURN_URL: ${EPAY_RETURN_URL:-}
      EPAY_CANCEL_URL: ${EPAY_CANCEL_URL:-}

  notification-service:
    <<: *service
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: notification-service
    environment:
      <<: *service-env
      PORT: 4006
      NOTIFICATION_SERVICE_PORT: 4006
      NOTIFICATION_DB_URL: postgres://${POSTGRES_USER:-ridefix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ridefix_db}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-mock}

  redis:
    image: redis:7-alpine
    profiles: [optional]
    ports:
      - '127.0.0.1:6379:6379'

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: [optional]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ridefix}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me-locally}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'

volumes:
  pgdata:
